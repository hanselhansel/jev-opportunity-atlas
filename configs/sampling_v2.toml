# Design v2 (L10): yield-aware stratified sampling for the screen budget.
# p_h (firsthand rate) and c_h (screen tokens per call) are not set here; they come
# from the pilot run's answers and ledger (sample allocate-v2 --pilot-run <run_id>).
floor_rate = 0.02
min_n = 30
seed = 20260930
screen_question_set = "screen@1"   # screen v1 is frozen for the pilot (docs/measurements)
firsthand_question = "firsthand_problem"
firsthand_threshold = 0.5   # pilot comment counts as firsthand when noul >= this
min_pilot_n = 20            # below this many pilot comments, a stratum borrows from a coarser level
