  - {id: 9400000107, category: genuine_firsthand, text: "We onboard about ten contractors a month. Each one needs accounts in six tools, and there is no single place to grant or revoke access, so I keep a checklist in a shared doc and tick boxes by hand. Twice this year a departed contractor still had access weeks later.", expected: {firsthand_problem: "yes", account_type: firsthand_account, workaround: "yes", paid: "no", resolution: unresolved}, why: "Q1 yes; a hand-kept checklist is a manual process; ongoing so unresolved"}
