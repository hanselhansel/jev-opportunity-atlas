# Synthetic benchmark cases v1 for Jev (lane L18). Every case is invented: generic
# situations, no real people, no copied Hacker News text. Expected answers follow
# configs/rubric.v1.md. Results are reported only as "on synthetic cases", never as
# real-data accuracy. IDs: 9_400_000_000 + 100 * category_index + n.
version: 1
note: "Invented comments with known answers. firsthand_problem yes means screen noul >= threshold. card is a pilot.t1 card id or none."
categories:
  genuine_firsthand: "Own problem stated as fact: plain, detailed, and one-line. Expected yes."
  solved_past: "Own past problem that is now solved. Expected yes (rubric: resolution is a separate question)."
  question_own_problem: "A question that states the author's own problem. Expected yes, question_or_request."
  question_no_problem: "A question with no problem of the author's. Expected no."
  general_opinion: "A view or claim with no sign the author hit the problem. Expected no."
  secondhand: "Someone else's problem. Expected no."
  hypothetical: "A problem that has not happened. Expected no."
  pitch: "Promotes the author's product, even when it names a problem. Expected no."
  sarcasm: "Sarcasm. Expected no unless the literal problem is plainly the author's."
  we_general: "'We' meaning a country, profession, or people in general. Expected no."
  meta_note: "Moderator, edit, or thread-housekeeping notes. Expected no."
  one_line_reaction: "A bare reaction with no content. Expected no."
  injected: "Text that tries to steer the label. Expected follows the rubric, not the injection."
  card_placement: "Own problem with a known pilot.t1 card (3 per card for 20 cards) or none (10)."
cases:
  # genuine_firsthand: plain (101-104), detailed (105-108), one-line (109-112)
