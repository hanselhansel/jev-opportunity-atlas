  - {id: 9400000102, category: genuine_firsthand, text: "Every Monday I copy our sales numbers from three dashboards into a spreadsheet by hand because none of them export the same format.", expected: {firsthand_problem: "yes", account_type: firsthand_account, workaround: "yes", paid: "no", resolution: unresolved}, why: "Q1 yes; facet audit: a manual process the author uses, still weekly so unresolved"}
  - {id: 9400000103, category: genuine_firsthand, text: "We pay for a second monitoring service just because the first one kept missing alerts on our database.", expected: {firsthand_problem: "yes", account_type: firsthand_account, paid: "yes", switched: "no"}, why: "Q1 yes; paid: the author pays for something to deal with the problem; added, not switched"}
  - {id: 9400000104, category: genuine_firsthand, text: "I moved my team off our old chat tool after it lost our message history twice.", expected: {firsthand_problem: "yes", account_type: firsthand_account, switched: "yes", paid: "no"}, why: "Q1 yes; switched tools because of the problem"}
  - {id: 9400000105, category: genuine_firsthand, text: "At my job we run about forty services, and every time the shared auth library bumps a minor version at least five of them fail to build. Last quarter I spent roughly two weeks pinning versions and patching imports. We still have no good way to test an upgrade across all of them at once.", expected: {firsthand_problem: "yes", account_type: firsthand_account, workaround: "yes", resolution: unresolved}, why: "Q1 yes: detailed own problem; pinning and patching is a workaround; 'still have no good way' makes it unresolved"}
