# Main-run need cards, taxonomy t3 (t2 plus one induction round on the explore-half residue).
# t3 adds n136-n150 after Claude read 600 weighted explore-half residue pain sentences
# (in-group none or card_p < 0.5 under t2; seed 20261004). Base t2 notes follow.
# Drafted by Claude (Opus 5.5, Claude Code main
# session) after reading 1,500 pain sentences that Jev selected (facets@2 pain_sentence)
# from explore-half screen positives with account_type firsthand_account, drawn with
# probability proportional to survey weight (seed 20261001). Builds on pilot t1: most
# t1 cards survive with sharper wording; the Hacker News site-mechanics theme is split
# out of the old c29. Inputs are recorded by comment ID and text hash only in
# taxonomy/t2/provenance.json. Jev never writes card text. Any edit bumps the version.
taxonomy_version: t3
groups:
  g01: {label: "AI coding agents and developer AI tools"}
